[package]
name = "kt"
version = "0.0.12"
edition = "2021"


[dependencies]
anyhow = "=1.0.100"
byte-unit = "=5.2.0"
clap = { version = "=4.5.53", features = ["derive"] }
env_logger = "=0.11.8"
futures = "=0.3.31"
hdrhistogram = "=7.5.4"
http = "=1.4.0"
http-body-util = { version = "=0.1.3" }
humantime = "=2.3.0"
hyper = { version = "=1.8.1", features = ["full"] }
hyper-rustls = { version = "=0.27.7", default-features = false, features = [
    "logging",
    "ring",
    "tls12",
    "http1",
    "http2",
] }
hyper-util = { version = "=0.1.19", features = ["full"] }
itertools = "=0.14.0"
log = "=0.4.29"
mlua = { version = "=0.11.5", features = [
    "lua54",
    "vendored",
    "async",
    "macros",
] }
prettytable-rs = "=0.10.0"
rustls = { version = "=0.23.35", default-features = false, features = [
    "logging",
    "ring",
    "tls12",
] }
tokio = { version = "=1.48.0", features = ["full"] }
tracing = "=0.1.44"
tracing-subscriber = "=0.3.22"
webpki-roots = "=1.0.4"
