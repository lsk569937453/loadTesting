[package]
name = "cargo-kt"
version = "0.0.12"
edition = "2024"
description = "A simple yet powerful command-line HTTP stress testing tool written in Rust"
license = "MIT"

[[bin]]
name = "kt"
path = "src/main.rs"
[dependencies]
anyhow = "=1.0.102"
axum = "=0.8.9"
byte-unit = "=5.2.0"
clap = { version = "=4.6.1", features = ["derive"] }
env_logger = "=0.11.10"
futures = "=0.3.32"
hdrhistogram = "=7.5.4"
http = "=1.4.2"
http-body-util = { version = "=0.1.3" }
humantime = "=2.3.0"
hyper = { version = "=1.10.1", features = ["full"] }
hyper-rustls = { version = "=0.27.9", default-features = false, features = [
    "logging",
    "ring",
    "tls12",
    "http1",
    "http2",
] }
hyper-util = { version = "=0.1.20", features = ["full"] }
indicatif = "=0.18.4"
itertools = "=0.14.0"
log = "=0.4.32"
mlua = { version = "=0.11.6", features = [
    "lua54",
    "vendored",
    "async",
    "macros",
] }
num_cpus = "=1.17.0"
prettytable-rs = "=0.10.0"
reqwest = { version = "=0.13.4", features = ["json"] }
rustls = { version = "=0.23.40", default-features = false, features = [
    "logging",
    "ring",
    "tls12",
] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
tokio = { version = "=1.52.3", features = ["full"] }
tokio-util = "0.7"
tower = "=0.5.3"
tower-http = { version = "=0.6.11", features = ["cors"] }
tracing = "=0.1.44"
tracing-subscriber = "=0.3.23"
webpki-roots = "=1.0.7"
